# Publishes Penny's web view (04_Workflow/web) to GitHub Pages.
# One-time setup: repository Settings > Pages > Source: GitHub Actions.
# Refresh the data on your computer first:  ./penny web-export --package <package folder>
name: Publish web view

on:
  push:
    branches: [main]
    paths: ["04_Workflow/web/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 04_Workflow/web
      - id: deployment
        uses: actions/deploy-pages@v4
