<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Penny · AP Automation</title>
  <meta name="description" content="Penny reads vendor invoices, applies accounts payable rules, and shows people exactly what to enter, what to hold, and why.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/penny.css">
  <script>
    try { var t = localStorage.getItem("penny.theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <a class="brand" href="#/">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" /><path d="M12 23V9h5.2a4.4 4.4 0 0 1 0 8.8H12" /></svg>
        <span class="brand-text"><span class="brand-name">Penny</span><span class="brand-sub">AP automation</span></span>
      </a>
      <nav>
        <ul class="nav" id="nav">
          <li><a href="#/" data-nav="dashboard"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 3h6v8H3zM11 3h6v5h-6zM11 10h6v7h-6zM3 13h6v4H3z"/></svg>Dashboard</a></li>
          <li><a href="#/runs" data-nav="runs"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 4h12M4 10h12M4 16h12"/><circle cx="4" cy="4" r=".5"/></svg>Runs</a></li>
          <li><a href="#/invoices" data-nav="invoices"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 2.5h7l3 3v12H5z"/><path d="M8 9h4M8 12h4"/></svg>Invoices</a></li>
          <li><a href="#/rules" data-nav="rules"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 5h12M4 10h12M4 15h12"/><circle cx="8" cy="5" r="1.6"/><circle cx="13" cy="10" r="1.6"/><circle cx="7" cy="15" r="1.6"/></svg>Rules</a></li>
          <li><a href="#/about" data-nav="about"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.5"/><path d="M10 9v5M10 6.2v.1"/></svg>How Penny works</a></li>
        </ul>
      </nav>
      <p class="motto">AI reads. Code decides.<br>People approve.</p>
    </aside>

    <div class="main-col">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6h14M3 10h14M3 14h14"/></svg>
        </button>
        <div class="search" role="search">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="M13 13l4 4"/></svg>
          <input id="search" type="search" placeholder="Search vendor, invoice, PO or amount" autocomplete="off"
                 aria-label="Search invoices" aria-controls="search-results" aria-expanded="false" aria-autocomplete="list" role="combobox">
          <kbd class="search-kbd" aria-hidden="true">/</kbd>
          <ul class="search-results" id="search-results" role="listbox" hidden></ul>
        </div>
        <div class="topbar-right">
          <label class="role-picker">
            <span class="role-label">Viewing as</span>
            <select id="role" aria-label="Viewing as role">
              <option value="viewer">Viewer</option>
              <option value="clerk">AP Clerk</option>
              <option value="approver">Approver</option>
              <option value="admin">Admin</option>
            </select>
          </label>
          <button class="icon-btn" id="theme-btn" aria-label="Switch color theme">
            <svg class="i-sun" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.5"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.3 4.3l1.4 1.4M14.3 14.3l1.4 1.4M4.3 15.7l1.4-1.4M14.3 5.7l1.4-1.4"/></svg>
            <svg class="i-moon" viewBox="0 0 20 20" aria-hidden="true"><path d="M16 12.5A6.5 6.5 0 0 1 7.5 4a6.5 6.5 0 1 0 8.5 8.5z"/></svg>
          </button>
        </div>
      </header>
      <main id="main" tabindex="-1">
        <div class="loading" role="status">Loading Penny…</div>
      </main>
      <footer class="footer">
        <span id="generated"></span>
        <span>Penny is a portfolio project by Jamie Collier. Example data from the Hillpointe AP technical screen.</span>
      </footer>
    </div>
  </div>
  <div class="scrim" id="scrim" hidden></div>
  <script src="assets/penny.js" defer></script>
</body>
</html>
